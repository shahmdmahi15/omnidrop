<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Title Badge -->
  <rect x="100" y="90" width="320" height="40" rx="20" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1.5" />
  <text x="260" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#00f0ff" text-anchor="middle">
    MULTI-PATH P2P MESH FABRIC
  </text>

  <!-- Big Title -->
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="76" font-weight="900" fill="url(#text-grad)">
    OmniDrop
  </text>

  <!-- Subtitle -->
  <text x="100" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
    Ultra-High-Throughput Content-Defined Mesh File Transport
  </text>

  <!-- Metric Badges -->
  <g transform="translate(100, 340)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="220" height="110" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />
    <text x="24" y="42" font-family="sans-serif" font-size="14" fill="#94a3b8">Peak Throughput</text>
    <text x="24" y="85" font-family="sans-serif" font-size="36" font-weight="800" fill="#00f0ff">2.48 Gbps</text>

    <!-- Box 2 -->
    <rect x="250" y="0" width="220" height="110" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />
    <text x="274" y="42" font-family="sans-serif" font-size="14" fill="#94a3b8">Chunking Tech</text>
    <text x="274" y="85" font-family="sans-serif" font-size="32" font-weight="800" fill="#38bdf8">FastCDC</text>

    <!-- Box 3 -->
    <rect x="500" y="0" width="220" height="110" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />
    <text x="524" y="42" font-family="sans-serif" font-size="14" fill="#94a3b8">Cryptography</text>
    <text x="524" y="85" font-family="sans-serif" font-size="32" font-weight="800" fill="#a855f7">Noise XX</text>

    <!-- Box 4 -->
    <rect x="750" y="0" width="220" height="110" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />
    <text x="774" y="42" font-family="sans-serif" font-size="14" fill="#94a3b8">Integrity Verifier</text>
    <text x="774" y="85" font-family="sans-serif" font-size="32" font-weight="800" fill="#00f0ff">BLAKE3</text>
  </g>

  <!-- Author Tag -->
  <text x="100" y="550" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1">
    Engineered by Shah Md. Mahi  •  Open-Source on GitHub  •  MIT License
  </text>
</svg>
